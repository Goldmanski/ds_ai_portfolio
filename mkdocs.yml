site_name: Goldmanski — Data Science & AI
site_author: Eliasz Nowicki
site_url: https://goldmanski.github.io/ds_ai_portfolio
site_description: >
  Portfolio of projects in Data Science, Machine Learning, AI, and Software Engineering.

repo_name: Goldmanski/ds_ai_portfolio
repo_url: https://github.com/Goldmanski/ds_ai_portfolio

theme:
  name: material

  palette:
    primary: yellow
    accent: amber

  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - content.code.copy
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.preview

  font:
    text: Inter
    code: Roboto Mono

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

nav:
  - Home: index.md

  - AI Engineering:
      - Half Marathon Predictor: half_marathon_predictor/index.md
      - Voice Recall: voice_recall/index.md
      - CVTailor: cv_tailor/index.md
      - ChatLab: chatlab/index.md

  - Machine Learning:
      - Find Friends: find_friends/index.md

  - Data Analysis:
      - Titanic: titanic/index.md
      - Iris: iris/index.md

  - Software Engineering:
      - Offer Generator: offer_generator/index.md

  - About: about.md

plugins:
  - search

  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true

      languages:
        - locale: en
          default: true
          name: English
          build: true

        - locale: pl
          name: Polski
          build: true
          nav_translations:
            Home: Strona główna
            AI Engineering: AI Engineering
            Machine Learning: Machine Learning
            Data Analysis: Analiza danych
            Software Engineering: Software Engineering
            About: O mnie
            Half Marathon Predictor: Half Marathon Predictor
            Voice Recall: Voice Recall
            CVTailor: CVTailor
            ChatLab: ChatLab
            Find Friends: Find Friends
            Titanic — Exploratory Data Analysis: Titanic — Eksploracyjna analiza danych
            Iris — Exploratory Data Analysis: Iris — Eksploracyjna analiza danych
            Offer Generator: Generator ofert

        - locale: es
          name: Español
          build: true
          nav_translations:
            Home: Inicio
            AI Engineering: AI Engineering
            Machine Learning: Machine Learning
            Data Analysis: Análisis de datos
            Software Engineering: Ingeniería de software
            About: Sobre mí
            Half Marathon Predictor: Half Marathon Predictor
            Voice Recall: Voice Recall
            CVTailor: CVTailor
            ChatLab: ChatLab
            Find Friends: Find Friends
            Titanic — Exploratory Data Analysis: Titanic — Análisis exploratorio de datos
            Iris — Exploratory Data Analysis: Iris — Análisis exploratorio de datos
            Offer Generator: Generador de ofertas

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.tabbed:
      alternate_style: true

